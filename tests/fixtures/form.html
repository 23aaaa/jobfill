<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>ApplyDock form fixture</title><style>body{font:15px system-ui;padding:24px;color:#263a31}label{display:block;margin:12px 0}input,textarea,select{display:block;min-width:230px;padding:9px;margin:5px 0}textarea{height:100px}#editable{white-space:pre-wrap;min-height:60px;border:1px solid #888;padding:10px}button{padding:10px}iframe{height:120px}h1{font-size:23px}small{color:#66776b}</style>
<h1>示例招聘表单</h1><small>仅用于本地兼容性测试，不代表任何真实招聘平台。</small>
<form id="form"><label>姓名<input id="name" value="原有内容"></label><label>联系电话<input id="phone" type="tel"></label><label>岗位职责<textarea id="duties">已有的第一行
已有的第二行</textarea></label><label>地区<select id="city"><option value="">请选择</option><option value="bj">北京</option><option value="sh">上海</option><option disabled value="disabled">禁用项</option><option hidden value="hidden">隐藏项</option></select></label>
<label>短字段<input id="limited" maxlength="4" value="old"></label><label>密码<input id="password" type="password" value="keep"></label><label>附件<input id="upload" type="file"></label><label>只读<input id="readonly" value="keep" readonly></label><label>禁用<input id="disabled" value="keep" disabled></label><input id="hidden" type="hidden" value="keep">
<label>日期<input id="date" type="date"></label><label>数字<input id="number" type="number"></label><label>受控输入<input id="controlled"></label><div id="editable" role="textbox" aria-label="纯文本编辑器" contenteditable="true">旧的描述</div><div class="ProseMirror" id="rich" contenteditable="true">复杂编辑器</div><label>同名歧义<select id="ambiguous"><option value="a">重复</option><option value="b">重复</option></select></label><div id="shadow-host"></div><button type="button" id="other">其他操作</button><button type="submit" id="submit">提交（测试计数）</button></form>
</html>
